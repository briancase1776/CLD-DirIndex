# cld.conf -- configuration for the .cld index checkers.
#
# THIS IS THE SHIPPED DEFAULT. Copy it to the root of a host repo when
# you adopt the toolkit, then edit the values to match that repo. Every
# setting below is active and set to its default, so editing means
# changing a value, not hunting for which line to uncomment.
#
# CLD-DirIndex runs on this file itself, so the defaults you copy are
# the ones exercised by every check and every test run here.
#
# This file is SOURCED by /bin/sh. Shell syntax, no exports needed.
# scripts/cld-config.sh holds the same values as fallbacks, so a repo
# with no cld.conf at all still works -- but a repo of any size will
# want one.
#
# ORDER OF ADOPTION, most likely to matter first:
#   1. CLD_EXTRA_SPECIES  -- if your repo mints its own .cld species,
#                            declare them FIRST or symbol-audit reports
#                            every one of them as a bad header
#   2. CLD_SKIP_RE        -- name your vendored and generated trees
#   3. CLD_INDEXABLE_EXTS -- the extensions your dir indexes must list
#   ...the rest are escape hatches most repos never touch.


# --- Species -----------------------------------------------------------
# Line-1 tokens symbol-audit accepts as a known non-symbol .cld species.
# FILE (symbol index) and INDEX (directory index) are always accepted.
# List any OTHER species your repo mints, space separated, or every one
# of those files is reported SYM-HDR. This is the single most common
# adoption mistake: a repo with a few hundred session or capture .cld
# files gets a few hundred findings until this line is right.
#   e.g. CLD_EXTRA_SPECIES="SESSION CAPTURE MODES ==="
CLD_EXTRA_SPECIES=""


# --- What is not indexed -----------------------------------------------
# Trees that legitimately carry no index (a grep BRE -- alternate with
# \|, not |). Add your vendored, generated, and binary paths.
#
# This list is the SINGLE place a "do not index this" decision is
# recorded. That is what lets NOENTRY block without being a judgment
# call: if a file is not skipped here, its absence from its directory's
# index.cld is a real violation. Keep it honest and it stays useful.
# .git/ is always skipped whether or not it appears here.
CLD_SKIP_RE='\.git/\|node_modules/\|vendor/\|dist/\|build/'

# Extensions a DIRECTORY index is expected to list. A file outside this
# set (an image, a pdf, a binary) never raises NOENTRY. *.cld is always
# excluded regardless -- an index never indexes itself.
CLD_INDEXABLE_EXTS="js md txt html css json sh"


# --- Escape hatches ----------------------------------------------------
# index.cld files that are NOT directory indexes -- same filename,
# different format. Empty means "every index.cld is a directory index".
#   e.g. CLD_NOT_DIR_INDEX_RE='docs/sessions/index\.cld$'
CLD_NOT_DIR_INDEX_RE=''

# .cld files that carry a FILE header but are NOT symbol indexes --
# another domain that borrowed the species token. Exempted from
# symbol-audit and from the symbol lookup skills.
#
# Note the cost before you reach for this: exempting a file removes it
# from EVERY symbol check, not just the one that is bothering you. A
# file exempted to silence SYM-NAME also stops being checked for
# duplicate keys and dead targets. Prefer renaming the file.
#   e.g. CLD_NOT_SYMBOL_INDEX_RE='^notes/the-plan.*\.cld$'
CLD_NOT_SYMBOL_INDEX_RE=''


# --- SYM-MISS (warning only) -------------------------------------------
# "This source file declares symbols but has no <file>.cld beside it."
# Which sources to consider, what counts as a declaration (an ERE, used
# with grep -E), and which trees to leave alone.
CLD_SYM_MISS_EXTS="js"
CLD_DECL_RE='^[[:space:]]*class |^function '
CLD_SYM_MISS_SKIP_RE='tests/\|vendor/\|node_modules/'
